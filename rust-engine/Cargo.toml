[package]
name = "cnc-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic local G-code inspection engine (3-axis mill subset)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
